# Site configuration for JP Blog

theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: JP Blog
tagline: Windows Developer 的技术记录
description: >-
  JP 的个人技术博客，记录 C#、.NET、WPF、UWP、WinUI、MSIX 以及 Windows 开发实践。

url: "https://hongjiapeng.github.io"
baseurl: ""

# Keep the old Jekyll pretty URLs so existing search results and bookmarks
# remain valid after the theme migration.
permalink: /:year/:month/:day/:title/

github:
  username: hongjiapeng

social:
  name: JP
  email: hongjiapeng@hotmail.com
  links:
    - https://github.com/hongjiapeng

# Sidebar avatar.
avatar: https://avatars.githubusercontent.com/u/26671281?v=4

# Follow the visitor's system preference and allow manual light/dark switching.
theme_mode:

# Enable the built-in table of contents, PWA support and pagination.
toc: true
pwa:
  enabled: true
  cache:
    enabled: true

# Comments are intentionally disabled until a public provider is configured.
# Giscus is recommended for this GitHub Pages site:
# https://giscus.app/
comments:
  provider:

paginate: 10

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /:year/:month/:day/:title/
  - scope:
      path: "_drafts"
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
